# Workflow derived from https://github.com/r-wasm/actions/tree/v1/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: Build Rnssp-wasm

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wasm packages
        uses: r-wasm/actions/build-rwasm@v3
        with:
          packages: cdcgov/Rnssp
          strip: "demo,docs,examples,help,html,include,tests,pkgdown,vignettes"
          image-path: _image
          repo-path: _site

      - name: Verify webR repo output
        shell: bash
        run: |
          set -euo pipefail

          echo "Tree under _site/bin/emscripten/contrib:"
          ls -la _site/bin/emscripten/contrib || true
          find _site/bin/emscripten/contrib -maxdepth 3 -type f -name PACKAGES -print || true

          # Required by your runtime/install path
          test -f _site/bin/emscripten/contrib/4.6/PACKAGES

          # Ensure Rnssp is actually indexed
          grep -q '^Package: Rnssp$' _site/bin/emscripten/contrib/4.6/PACKAGES

      - name: Upload wasm R package artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-repo
          path: _site

      - name: Upload wasm R library image artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-image
          path: _image

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download wasm R package repository artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-repo
          path: _site

      - name: Download wasm R library image artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-image
          path: _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4