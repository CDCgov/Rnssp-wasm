# Workflow derived from https://github.com/r-wasm/actions/tree/v1/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: Build Rnssp wasm repository

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # container: ghcr.io/r-wasm/webr:main
    steps:
      - uses: actions/checkout@v4
      - name: Build wasm packages
        uses: r-wasm/actions/build-wasm-packages@main
        with:
          strip: 'c("demo", "docs", "examples", "help", "html", "include", "tests", "pkgdown", "vignettes")'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download wasm R package repository artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-repo
          path: _site

      - name: Download wasm R library image artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-image
          path: _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4